<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>district by zomato · doodle prototype</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236830F9'/><circle cx='11' cy='16' r='4.5' fill='white'/><circle cx='12' cy='16' r='2.2' fill='%231B1530'/><circle cx='21' cy='16' r='4.5' fill='white'/><circle cx='22' cy='16' r='2.2' fill='%231B1530'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5FC;
  --ink: #1B1530;
  --mut: #6E6889;
  --sc: #FFFFFF;
  --pri: #6830F9;
  --pri-dark: #501CD9;
  --pri-light: #F0EBFF;
  --pri-glow: rgba(104, 48, 249, 0.25);
  --accent-pink: #FF3366;
  --accent-yellow: #FFB300;
  --ok: #10B981;
  --ok-bg: #E6FBF2;
  --warn: #F59E0B;
  --warn-bg: #FEF3C7;
  --line: #E8E2F5;
  --phone-bg: #FFFFFF;
  --phone-bar: #161226;
  --chip-bg: #EDE7FB;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0C1B;
    --ink: #F4F1FD;
    --mut: #9B94B8;
    --sc: #19142B;
    --line: #292244;
    --phone-bg: #141026;
    --chip-bg: #261D42;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0C1B;
  --ink: #F4F1FD;
  --mut: #9B94B8;
  --sc: #19142B;
  --line: #292244;
  --phone-bg: #141026;
  --chip-bg: #261D42;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  height: 100vh;
  max-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-y: hidden;
}

/* Header & Official District Logo */
header {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 10px 24px;
  max-width: 1560px;
  width: 100%;
  margin: 0 auto;
  border-bottom: 1px solid var(--line);
  background: var(--sc);
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.district-brand-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
}
.district-logo-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #140E26;
  padding: 5px 10px 5px 6px;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(20, 14, 38, 0.25);
}
.district-logo-img {
  height: 28px;
  width: 38px;
  object-fit: cover;
  object-position: 25% 40%;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.18);
}
.district-text-group {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.district-main-text {
  font-size: 19px;
  font-weight: 900;
  color: #FFFFFF;
  letter-spacing: -0.6px;
}
.district-sub-text {
  font-size: 9px;
  font-weight: 800;
  color: #C3B4FD;
  letter-spacing: 0.3px;
  margin-top: 1px;
}

/* Header Right Actions: GitHub + Switch */
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.gh-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 99px;
  background: var(--sc);
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 800;
  transition: all .2s ease;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
.gh-link-btn:hover {
  background: #1B1530;
  color: #FFF;
  border-color: #1B1530;
  transform: translateY(-1px);
}
.gh-link-btn svg {
  flex-shrink: 0;
}

/* The Animated Doodle Eyes Logo */
.doodle-txt {
  display: inline-flex;
  align-items: center;
  color: var(--pri);
  font-weight: 900;
}
.eyes-container {
  display: inline-flex;
  align-items: center;
  gap: 2.5px;
  margin: 0 1px;
  vertical-align: middle;
}
.doodle-eye {
  width: 16px;
  height: 20px;
  background: #FFF;
  border: 2.5px solid var(--pri);
  border-radius: 50% 50% 48% 48%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(0,0,0,0.15);
}
.pupil {
  width: 6.5px;
  height: 6.5px;
  background: #1B1530;
  border-radius: 50%;
  position: absolute;
  animation: eyeGlance 4.5s infinite ease-in-out;
}
.doodle-eye::after {
  content: "";
  position: absolute;
  top: 1.5px;
  left: 2px;
  width: 3px;
  height: 3px;
  background: #fff;
  border-radius: 50%;
  z-index: 2;
}

@keyframes eyeGlance {
  0%, 25% { transform: translate(0, 0); }
  30%, 45% { transform: translate(3px, -1px); }
  50%, 65% { transform: translate(-3px, -1px); }
  70%, 85% { transform: translate(0, 2px); }
  90%, 100% { transform: translate(0, 0); }
}

/* Switch */
.sw {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  background: var(--sc);
  padding: 7px 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
}
.sw i {
  width: 34px;
  height: 20px;
  border-radius: 99px;
  background: #D4CCE8;
  position: relative;
  transition: .2s;
}
.sw i:after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  transition: .2s;
}
.sw.on i { background: var(--pri); }
.sw.on i:after { left: 16px; }

/* 2-Column App Workspace: Stage in Main Limelight, Tour in Right Sidebar */
.app-workspace {
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 1560px;
  width: 100%;
  margin: 0 auto;
  padding: 10px 24px;
  gap: 28px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.stage-wrapper {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.sidebar-panel {
  width: 360px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-height: 100%;
}
.tc {
  background: var(--sc);
  border-radius: 20px;
  padding: 18px 20px;
  border: 1px solid var(--line);
  box-shadow: 0 16px 40px -24px var(--pri-glow);
  position: relative;
  max-height: min(565px, calc(100vh - 128px));
  overflow-y: auto;
}
.tc h2 {
  margin: 0 0 8px;
  font-size: 18px;
  letter-spacing: -0.4px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
.tc h2 .step-pill {
  font-size: 10.5px;
  background: var(--pri-light);
  color: var(--pri);
  padding: 3px 9px;
  border-radius: 99px;
  font-weight: 800;
  letter-spacing: 0.5px;
}
.tc p {
  margin: 0;
  color: var(--mut);
  line-height: 1.5;
  font-size: 13px;
}
.ctl {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.nav button {
  font: 700 13px 'Plus Jakarta Sans', system-ui, sans-serif;
  border: 0;
  border-radius: 12px;
  padding: 8px 15px;
  cursor: pointer;
  background: var(--pri-light);
  color: var(--pri);
  transition: all .15s ease;
}
.nav button.p {
  background: var(--pri);
  color: #fff;
}
.nav button.p:hover {
  background: var(--pri-dark);
  transform: translateY(-1px);
}
.nav button:disabled { opacity: 0.35; cursor: not-allowed; }
.dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.dots button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--mut);
  font: 800 11px 'Plus Jakarta Sans', system-ui, sans-serif;
  cursor: pointer;
  transition: .15s;
}
.dots button.on {
  background: var(--pri);
  color: #fff;
  border-color: var(--pri);
}
.off .txt, .off .nav { display: none; }
.off .ctl { margin-top: 0; }
.hint {
  display: none;
  text-align: center;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--mut);
  margin-bottom: 8px;
}

/* Stage & Mobile Frames */
.stage {
  display: flex;
  flex-wrap: nowrap;
  gap: 20px;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-height: 100%;
}
.col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  animation: phoneSlideIn .4s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes phoneSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}

/* The Mobile Hardware Frame */
.ph {
  width: 292px;
  height: min(560px, calc(100vh - 128px));
  border-radius: 38px;
  background: #FFF;
  border: 7px solid var(--phone-bar);
  box-shadow: 0 20px 50px -20px rgba(22, 18, 38, 0.35), 0 0 0 1px rgba(0,0,0,0.06);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: #1B1530;
  position: relative;
  isolation: isolate;
}
.sb {
  display: flex;
  justify-content: space-between;
  padding: 8px 20px 4px;
  font-size: 10.5px;
  font-weight: 800;
  background: inherit;
  z-index: 10;
  color: inherit;
}
.island {
  width: 76px;
  height: 16px;
  background: var(--phone-bar);
  border-radius: 20px;
  margin: 0 auto;
}

/* Scrollable In-App Content */
.ap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding: 8px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  background: linear-gradient(180deg, #FFFFFF 0%, #F9F7FD 100%);
  position: relative;
}
.ap::-webkit-scrollbar { display: none; }
.ap.ch { background: #EFE9F7; }

/* Phone Bottom Nav (District App) */
.bnav {
  height: 48px;
  border-top: 1px solid #ECE7F6;
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 4px;
  flex: none;
  z-index: 10;
}
.bnav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 9.5px;
  font-weight: 700;
  color: #8C85A8;
  cursor: pointer;
  position: relative;
  text-decoration: none;
}
.bnav-item.active {
  color: var(--pri);
}
.bnav-icon {
  font-size: 16px;
}
.bnav-item .badge {
  position: absolute;
  top: -3px;
  right: -5px;
  background: var(--accent-pink);
  color: #fff;
  font-size: 8px;
  padding: 1px 4px;
  border-radius: 6px;
  font-weight: 800;
}

/* User Avatar & Label below device */
.cap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.cap span:last-child { color: var(--mut); }
.av {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  flex: none;
}

/* UI Elements inside Mobile */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand-mark {
  font-weight: 900;
  font-size: 19px;
  letter-spacing: -0.7px;
  color: #1B1530;
  display: flex;
  align-items: center;
  gap: 4px;
}
.brand-mark small {
  font-size: 9px;
  color: var(--mut);
  font-weight: 700;
  letter-spacing: 0;
}

.h {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.2;
}
.s {
  font-size: 12px;
  color: #6E6889;
  line-height: 1.45;
}

/* Cards & Widgets */
.cd {
  background: #FFFFFF;
  border: 1px solid #ECE7F6;
  border-radius: 16px;
  padding: 11px 13px;
  font-size: 13px;
  box-shadow: 0 2px 8px rgba(104, 48, 249, 0.03);
}
.q {
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.4;
  border: 1.5px solid var(--pri);
  box-shadow: 0 0 0 3px var(--pri-light);
  background: #FAF8FF;
}
.cur {
  display: inline-block;
  width: 2px;
  height: 16px;
  background: var(--pri);
  margin-left: 2px;
  vertical-align: -3px;
  animation: cursorBlink 1s steps(1) infinite;
}
@keyframes cursorBlink { 50% { opacity: 0; } }

.loc {
  display: inline-flex;
  gap: 5px;
  align-self: flex-start;
  font-size: 11.5px;
  font-weight: 800;
  background: var(--pri-light);
  color: var(--pri);
  padding: 5px 11px;
  border-radius: 99px;
}

.pr {
  border: 1.5px dashed #C9BEEC;
  border-radius: 12px;
  padding: 9px 11px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s ease;
  background: #FFF;
}
.pr:hover { border-color: var(--pri); }
.pr.on {
  border-style: solid;
  border-color: var(--pri);
  background: var(--pri-light);
  color: var(--pri);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: 99px;
  background: var(--pri-light);
  color: var(--pri);
}
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.wn { background: var(--warn-bg); color: var(--warn); }
.chip.rd { background: #FFEBEF; color: var(--accent-pink); }

.btn {
  margin-top: auto;
  background: var(--pri);
  color: #fff;
  border: 0;
  border-radius: 16px;
  padding: 13px;
  font: 800 13.5px 'Plus Jakarta Sans', system-ui, sans-serif;
  width: 100%;
  cursor: pointer;
  flex: none;
  transition: .15s ease;
  box-shadow: 0 8px 18px -4px var(--pri-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:hover { background: var(--pri-dark); }
.btn.g { background: var(--pri-light); color: var(--pri); margin-top: 0; box-shadow: none; }
.btn.done { background: var(--ok); color: #fff; box-shadow: none; }

/* Timeline Slots */
.sl {
  display: grid;
  grid-template-columns: 46px 1fr;
  gap: 8px;
  align-items: start;
  animation: slotIn .35s ease both;
}
@keyframes slotIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.tm {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--pri);
  padding-top: 8px;
  line-height: 1.25;
}
.sl .cd { padding: 9px 11px; }
.alt {
  font-size: 11px;
  color: #6E6889;
  margin-top: 4px;
  border-top: 1px dashed var(--line);
  padding-top: 4px;
}

/* Polling & Sliders */
.opt {
  border: 1.5px solid var(--line);
  border-radius: 13px;
  padding: 9px 11px;
  font-size: 12px;
  cursor: pointer;
  margin-top: 7px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  background: #FFF;
  transition: .15s;
}
.opt.on {
  border-color: var(--pri);
  background: var(--pri-light);
}
.bar {
  height: 6px;
  border-radius: 9px;
  background: #ECE7F6;
  overflow: hidden;
  margin: 5px 0 9px;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--pri);
  border-radius: 9px;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  padding: 2.5px 0;
}
.bub {
  max-width: 86%;
  padding: 9px 12px;
  border-radius: 16px;
  font-size: 12.5px;
  line-height: 1.38;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.bub.me {
  align-self: flex-end;
  background: #DCF8C6;
  color: #123315;
}
.lk {
  margin-top: 7px;
  border-radius: 12px;
  background: #FFFFFF;
  border: 1.5px solid var(--pri-light);
  padding: 10px;
  font-size: 11.5px;
  box-shadow: 0 4px 14px rgba(104,48,249,0.08);
}
.lk-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.lk-badge {
  background: var(--pri);
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 6px;
}
.slider {
  height: 6px;
  border-radius: 9px;
  background: #ECE7F6;
  position: relative;
  margin: 12px 4px 6px;
}
.slider i {
  position: absolute;
  left: 20%;
  width: 50%;
  top: 0;
  bottom: 0;
  background: var(--pri);
  border-radius: 9px;
}
.slider-handle {
  position: absolute;
  top: -5px;
  width: 16px;
  height: 16px;
  background: #fff;
  border: 3px solid var(--pri);
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.slider-handle.l { left: 18%; }
.slider-handle.r { left: 68%; }

.ai {
  display: flex;
  gap: 7px;
  font-size: 12px;
  padding: 2.5px 0;
  line-height: 1.35;
}
.ai:before {
  content: "✓";
  color: var(--ok);
  font-weight: 900;
}

/* Spinner Loader */
.ld {
  margin: auto;
  text-align: center;
  display: grid;
  gap: 14px;
  justify-items: center;
}
.sp {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 5px solid var(--pri-light);
  border-top-color: var(--pri);
  animation: rot .8s linear infinite;
}
@keyframes rot { to { transform: rotate(1turn); } }

/* Footer */
.app-footer {
  padding: 8px 20px;
  border-top: 1px solid var(--line);
  background: var(--sc);
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--mut);
  flex-shrink: 0;
}
.footer-content {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.creator-link {
  color: var(--pri);
  font-weight: 800;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  background: var(--pri-light);
  padding: 3px 10px;
  border-radius: 99px;
  transition: all .2s ease;
}
.creator-link:hover {
  background: var(--pri);
  color: #fff;
  transform: translateY(-1px);
}
.footer-dot {
  opacity: 0.4;
}

/* District App Home Screen Components */
.dist-hero {
  background: linear-gradient(135deg, #3B0078 0%, #6830F9 100%);
  border-radius: 20px;
  padding: 14px 15px;
  color: #fff;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 24px -6px rgba(104, 48, 249, 0.45);
}
.dist-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(8px);
  padding: 3px 8px;
  border-radius: 99px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.dist-hero h3 {
  margin: 6px 0 3px;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: -0.4px;
}
.dist-hero p {
  margin: 0 0 12px;
  font-size: 11.5px;
  opacity: 0.9;
  line-height: 1.4;
}
.dist-hero-btn {
  background: #FFF;
  color: var(--pri);
  border: 0;
  border-radius: 12px;

.in-phone-celebrate {

  overflow: hidden;
  z-index: 40;

.in-phone-confetti-piece {

.in-phone-hurray-bubble {

const $ = id => document.getElementById(id);

function typePrompt() {
  const q = $('q');
  const t = SC[sc].p;
  if (!q || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let k = 0;
  const loop = () => {
    k += 2;
    q.firstChild.nodeValue = '“' + t.slice(0, k) + (k >= t.length ? '”' : '');
    if (k < t.length) setTimeout(loop, 16);
  };
  loop();
}

function render(shouldType = false) {
  const phoneCards = STEPS[curStep].p();
  $('stage').innerHTML = phoneCards.join('');
  $('stage').scrollLeft = 0;
  $('hint').hidden = phoneCards.length < 2;

  const isLast = curStep === STEPS.length - 1;
  $('tc').className = 'tc' + (guided ? '' : ' off');

  $('tc').innerHTML = `
    <div class="txt">
      <h2>
        <span class="step-pill">STEP ${curStep + 1} OF ${STEPS.length}</span>
        ${STEPS[curStep].t}
      </h2>
      <p>${STEPS[curStep].d}</p>
    </div>
    <div class="ctl">
      <div class="nav">
        <button class="bk" ${curStep ? '' : 'disabled'}>← Back</button>
        <button class="p nx">${isLast ? 'Restart Experience 🔄' : 'Next Step →'}</button>
      </div>
      <div class="dots">
        ${STEPS.map((s, n) => `
          <button class="${n === curStep ? 'on' : ''}" data-n="${n}" aria-label="Step ${n + 1}: ${s.t}">
            ${n + 1}
          </button>
        `).join('')}
      </div>
    </div>
  `;

  if (shouldType) typePrompt();
}

function goToStep(n) {
  curStep = n < 0 ? 0 : n >= STEPS.length ? 0 : n;
  render(curStep === 1);
  if (window.innerWidth <= 1120) {
    $('tc').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function handleAction(btn) {
  const action = btn.dataset.a;

  if (action === 'launch-doodle') {
    goToStep(1);
  } else if (action === 'next') {
    goToStep(curStep + 1);
  } else if (action === 'build') {
    const messages = [
      'Checking live tables & showtimes in Chennai…',
      'Factoring traffic buffer between stops…',
      'Verifying vegan options with restaurant chefs…',
      'Polishing your Doodle canvas…'
    ];
    const ap = btn.closest('.ap');
    ap.innerHTML = `
      <div class="ld">
        <div class="sp"></div>
        <b id="lm">${messages[0]}</b>
        <span class="s">Doodle is doing the heavy lifting</span>
      </div>
    `;
    let msgIdx = 0;
    const interval = setInterval(() => {
      msgIdx++;
      if ($('lm') && messages[msgIdx]) $('lm').textContent = messages[msgIdx];
    }, 450);
    setTimeout(() => {
      clearInterval(interval);
      goToStep(2);
    }, 1900);
  } else if (action === 'tick') {
    btn.innerHTML = `<span>${btn.dataset.t || 'Done ✓'}</span>`;
    btn.classList.add('done');
    const targetKey = btn.dataset.target;
    if (targetKey) {
      celebrateInsidePhone(targetKey, 'Saved! ✨');
    }
  } else if (action === 'lock') {
    btn.innerHTML = `<span>Doodle Locked ✓</span>`;
    btn.classList.add('done');
    celebrateInsidePhone('R', 'Plan Locked In! 🔒🎉');
    setTimeout(() => goToStep(curStep + 1), 1600);
  } else if (action === 'pay') {
    btn.innerHTML = `<span>Paid ₹960 with UPI ✓</span>`;
    btn.classList.add('done');
    const chip = $('dp-chip');
    if (chip) {
      chip.textContent = 'Paid ✓';
      chip.className = 'chip ok';
    }
    celebrateInsidePhone('D', 'Paid! Zero Awkwardness ⚡');
    setTimeout(() => {
      celebrateInsidePhone('R', 'Deepika Paid! 🙌');
    }, 800);
  } else if (action === 'approve') {
    btn.innerHTML = `<span>Reshuffle Live ✓ Squad Synced</span>`;
    btn.classList.add('done');
    celebrateInsidePhone('R', 'Crisis Averted! Squad Saved 🪄');
  }
}

// Global click delegation
document.addEventListener('click', e => {
  const t = e.target;
  let c;

  if (c = t.closest('[data-sc]')) {
    sc = +c.dataset.sc;
    render(true);
    return;
  }
  if (c = t.closest('.opt')) {
    const parent = c.parentNode;
    const opts = [...parent.querySelectorAll('.opt')];
    if (opts.length > 1) {
      opts.forEach(x => {
        x.classList.remove('on');
        const bullet = x.querySelector('span:last-child');
        if (bullet) bullet.textContent = '○';
      });
      c.classList.add('on');
      const activeBullet = c.querySelector('span:last-child');
      if (activeBullet) activeBullet.textContent = '●';
    }
    return;
  }
  if (c = t.closest('[data-a]')) {
    handleAction(c);
    return;
  }
  if (c = t.closest('[data-n]')) {
    goToStep(+c.dataset.n);
    return;
  }
  if (t.closest('.bk')) {
    goToStep(curStep - 1);
    return;
  }
  if (t.closest('.nx')) {
    goToStep(curStep + 1);
  }
});

// Accessible keyboard selection for options and prompts
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.pr, .opt, .dist-hero-btn')) {
    e.preventDefault();
    e.target.click();
  }
});

// Guided Tour switch toggle
const sw = $('sw');
const toggleTour = () => {
  guided = !guided;
  sw.classList.toggle('on', guided);
  sw.setAttribute('aria-checked', guided);
  render();
};
sw.addEventListener('click', toggleTour);
sw.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    toggleTour();
  }
});

// Initialize prototype
render(false);
})();
